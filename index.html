<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090a" />

    <title>Live2CallEm — AI Receptionist for HVAC & Local Service</title>
    <meta
      name="description"
      content="Stop losing customers to missed calls. A 24/7 AI receptionist that answers, books appointments, and follows up — built for HVAC, plumbing, electrical, and home service businesses."
    />

    <link rel="canonical" href="https://live2callem.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Live2CallEm — AI Receptionist for HVAC & Local Service" />
    <meta property="og:description" content="Stop losing customers to missed calls. 24/7 AI receptionist for HVAC and home service businesses." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://live2callem.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Live2CallEm — AI Receptionist for HVAC & Local Service" />
    <meta name="twitter:description" content="Stop losing customers to missed calls. 24/7 AI receptionist for HVAC and home service businesses." />

    <!-- Structured data for Google rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Live2CallEm",
            "url": "https://live2callem.com/",
            "email": "hello@live2callem.com",
            "description": "24/7 AI receptionist for HVAC, plumbing, electrical, and home service businesses."
          },
          {
            "@type": "Service",
            "name": "AI Receptionist for Home Service Businesses",
            "provider": { "@type": "Organization", "name": "Live2CallEm" },
            "serviceType": "AI phone answering and appointment booking",
            "areaServed": "US",
            "audience": {
              "@type": "BusinessAudience",
              "name": "HVAC, plumbing, electrical, and home service businesses"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does it really work with my existing business number?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You don't change anything customer-facing. We give you a setup that forwards calls when you don't answer (or 24/7, if you prefer). No porting, no new line on your business cards."
                }
              },
              {
                "@type": "Question",
                "name": "How fast can we get set up?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Most businesses are live the same day. Onboarding takes about 30 minutes — we learn your services, hours, service area, and pricing windows, then point your number at the AI."
                }
              },
              {
                "@type": "Question",
                "name": "Can it actually book appointments into our calendar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. We integrate with most scheduling tools (Google Calendar, Housecall Pro, Jobber, ServiceTitan, and more). The AI books with the right service window, captures address and notes, and confirms by SMS."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>

  </body>
